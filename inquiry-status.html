<style>
#viewStatusApp{
  width:100%;
  padding:18px;
  background:#f5f7f9;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;
}

#viewStatusApp *{
  box-sizing:border-box;
}

#viewStatusApp .head{
  margin-bottom:16px;
}

#viewStatusApp .head h2{
  margin:0 0 5px;
  font-size:24px;
}

#viewStatusApp .head p{
  margin:0;
  color:#71808d;
  font-size:13px;
}

#viewStatusApp .summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px;
}

#viewStatusApp .summary-box{
  padding:15px;
  border:1px solid #dfe5ea;
  border-radius:10px;
  background:#fff;
}

#viewStatusApp .summary-box span{
  display:block;
  margin-bottom:7px;
  color:#71808d;
  font-size:12px;
}

#viewStatusApp .summary-box strong{
  font-size:21px;
}

#viewStatusApp .panel{
  overflow:hidden;
  border:1px solid #dfe5ea;
  border-radius:10px;
  background:#fff;
}

#viewStatusApp .panel-title{
  padding:14px 15px;
  border-bottom:1px solid #e4e9ed;
  font-size:16px;
  font-weight:800;
}

#viewStatusApp .filters{
  display:grid;
  grid-template-columns:1fr 1fr 1.3fr 1.5fr auto;
  gap:7px;
  padding:12px;
}

#viewStatusApp input,
#viewStatusApp select,
#viewStatusApp button{
  height:38px;
  padding:0 9px;
  border:1px solid #cad4dc;
  border-radius:6px;
  background:#fff;
  font-size:12px;
}

#viewStatusApp button{
  padding:0 15px;
  border:0;
  background:#12394d;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

#viewStatusApp .table-tools{
  padding:10px 12px;
  border-top:1px solid #e5eaee;
}

#viewStatusApp .table-wrap{
  overflow:auto;
}

#viewStatusApp table{
  width:100%;
  min-width:1050px;
  border-collapse:collapse;
}

#viewStatusApp th{
  padding:11px 7px;
  border-bottom:1px solid #dfe5ea;
  background:#f6f8fa;
  color:#536575;
  font-size:12px;
  white-space:nowrap;
}

#viewStatusApp td{
  padding:12px 7px;
  border-bottom:1px solid #edf0f2;
  font-size:12px;
  text-align:center;
  white-space:nowrap;
}

#viewStatusApp .valid{
  color:#17804b;
  font-weight:800;
}

#viewStatusApp .waiting{
  color:#b27a20;
  font-weight:800;
}

#viewStatusApp #empty{
  padding:55px 10px;
  color:#8b98a3;
  text-align:center;
}

@media(max-width:750px){
  #viewStatusApp{
    padding:10px;
  }

  #viewStatusApp .summary{
    grid-template-columns:1fr 1fr;
  }

  #viewStatusApp .filters{
    grid-template-columns:1fr 1fr;
  }

  #viewStatusApp .head h2{
    font-size:21px;
  }
}
</style>


<div id="viewStatusApp">

  <div class="head">
    <h2>조회 현황</h2>
    <p>분양 카탈로그 조회 및 유효조회 현황을 확인합니다.</p>
  </div>

  <div class="summary">

    <div class="summary-box">
      <span>전체 조회</span>
      <strong id="v1">0건</strong>
    </div>

    <div class="summary-box">
      <span>유효조회</span>
      <strong id="v2">0건</strong>
    </div>

    <div class="summary-box">
      <span>포인트 지급</span>
      <strong id="v3">0 P</strong>
    </div>

    <div class="summary-box">
      <span>충전금 차감</span>
      <strong id="v4">0원</strong>
    </div>

  </div>


  <div class="panel">

    <div class="panel-title">
      분양 카탈로그 조회내역
    </div>

    <div class="filters">

      <input type="date" id="sd">
      <input type="date" id="ed">

      <select id="rg">
        <option value="">전체 지역</option>
        <option>서울특별시</option>
        <option>부산광역시</option>
        <option>대구광역시</option>
        <option>인천광역시</option>
        <option>대전광역시</option>
        <option>울산광역시</option>
        <option>세종특별자치시</option>
        <option>경기도</option>
        <option>강원특별자치도</option>
        <option>충청북도</option>
        <option>충청남도</option>
        <option>전북특별자치도</option>
        <option>전남광주통합특별시</option>
        <option>경상북도</option>
        <option>경상남도</option>
        <option>제주특별자치도</option>
      </select>

      <input
        type="text"
        id="kw"
        placeholder="분양사·아파트명 검색"
      >

      <button type="button" id="searchBtn">
        조회
      </button>

    </div>


    <div class="table-tools">
      총 <strong id="cnt">0</strong>건
    </div>


    <div class="table-wrap">

      <table>
        <thead>
          <tr>
            <th>조회일시</th>
            <th>지역</th>
            <th>분양사</th>
            <th>아파트</th>
            <th>확인 페이지</th>
            <th>조회시간</th>
            <th>유효조회</th>
            <th>지급 포인트</th>
            <th>충전금 차감</th>
          </tr>
        </thead>

        <tbody id="rows"></tbody>
      </table>

      <div id="empty">
        조회된 분양 카탈로그 내역이 없습니다.
      </div>

    </div>

  </div>

</div>


<script>
(function(){
"use strict";

var root=document.getElementById("viewStatusApp");
if(!root)return;

var D=[];

function el(id){
  return root.querySelector("#"+id);
}

function n(v){
  return Number(v||0).toLocaleString("ko-KR");
}

function show(A){

  var total=A.length;
  var valid=0;
  var point=0;
  var charge=0;

  el("rows").innerHTML="";
  el("cnt").textContent=total;

  el("empty").style.display=
    total ? "none" : "block";


  A.forEach(function(x){

    if(x.valid){
      valid++;
    }

    point+=Number(x.point||0);
    charge+=Number(x.charge||0);

    var tr=document.createElement("tr");

    tr.innerHTML=
      "<td>"+(x.date||"-")+"</td>"+
      "<td>"+(x.region||"-")+"</td>"+
      "<td>"+(x.company||"-")+"</td>"+
      "<td>"+(x.apt||"-")+"</td>"+
      "<td>"+(x.pages||0)+"/8</td>"+
      "<td>"+(x.time||"00:00")+"</td>"+
      "<td class='"+(x.valid?"valid":"waiting")+"'>"+
        (x.valid?"유효":"미완료")+
      "</td>"+
      "<td>"+n(x.point)+" P</td>"+
      "<td>"+n(x.charge)+"원</td>";

    el("rows").appendChild(tr);
  });


  el("v1").textContent=
    n(total)+"건";

  el("v2").textContent=
    n(valid)+"건";

  el("v3").textContent=
    n(point)+" P";

  el("v4").textContent=
    n(charge)+"원";
}


function search(){

  var sd=el("sd").value;
  var ed=el("ed").value;
  var rg=el("rg").value;

  var kw=
    el("kw")
    .value
    .trim()
    .toLowerCase();


  var result=D.filter(function(x){

    var date=
      String(x.date||"").slice(0,10);

    if(sd && date<sd){
      return false;
    }

    if(ed && date>ed){
      return false;
    }

    if(rg && x.region!==rg){
      return false;
    }

    var text=(
      (x.company||"")+" "+
      (x.apt||"")
    ).toLowerCase();

    if(
      kw &&
      !text.includes(kw)
    ){
      return false;
    }

    return true;
  });


  show(result);
}


el("searchBtn").onclick=search;

el("kw").addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){
      search();
    }

  }
);


var today=new Date();

el("ed").value=
  today.toISOString().slice(0,10);

today.setDate(1);

el("sd").value=
  today.toISOString().slice(0,10);


show(D);

})();
</script>
