<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102f42">
<title>본사 관리자 로그인 | 우리아파트 분양</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{
  min-height:100vh;
  background:#eef7fb;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}
.wrap{
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:clamp(28px,8vw,70px) 14px 50px;
}
.brand{
  margin-bottom:14px;
  padding:22px;
  border-radius:16px;
  background:#102f42;
  color:#fff;
}
.brand small{
  display:block;
  margin-bottom:8px;
  color:#f0c15a;
  font-weight:800;
  letter-spacing:1px;
}
.brand h1{
  margin:0 0 7px;
  font-size:clamp(23px,5vw,29px);
}
.brand p{
  margin:0;
  color:#d8e5eb;
  font-size:13px;
  line-height:1.55;
}
.card{
  padding:20px;
  border:1px solid #dfe6eb;
  border-radius:16px;
  background:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}
.card h2{
  margin:0 0 16px;
  font-size:20px;
}
.field{margin-bottom:12px}
label{
  display:block;
  margin-bottom:6px;
  color:#526676;
  font-size:13px;
  font-weight:800;
}
input{
  width:100%;
  height:46px;
  padding:0 12px;
  border:1px solid #cbd5dc;
  border-radius:8px;
  font-size:15px;
  outline:none;
}
input:focus{border-color:#102f42}
button{
  width:100%;
  min-height:48px;
  margin-top:4px;
  border:0;
  border-radius:8px;
  background:#102f42;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}
.demo{
  margin-top:15px;
  padding:14px;
  border-radius:10px;
  background:#fff7df;
  color:#604d20;
  font-size:13px;
  line-height:1.7;
}
.demo strong{
  display:block;
  margin-bottom:4px;
  color:#8a6511;
}
.msg{
  min-height:22px;
  margin-top:10px;
  font-size:13px;
  font-weight:700;
}
.msg.error{color:#c4473d}
.msg.ok{color:#17804b}
.note{
  margin-top:12px;
  color:#7a8994;
  font-size:12px;
  line-height:1.55;
  text-align:center;
}
@media(max-width:480px){
  .wrap{padding-left:10px;padding-right:10px}
  .card{padding:16px}
  input{height:48px;font-size:16px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <small>WOORI APT HEAD OFFICE</small>
    <h1>본사 관리자</h1>
    <p>전체 분양현장과 조회현황, 충전금, 포인트 정산 및 시스템을 관리합니다.</p>
  </div>

  <div class="card">
    <h2>본사 관리자 로그인</h2>

    <form id="loginForm">
      <div class="field">
        <label for="adminId">아이디</label>
        <input id="adminId" type="text" autocomplete="username" placeholder="본사 관리자 아이디">
      </div>

      <div class="field">
        <label for="adminPw">비밀번호</label>
        <input id="adminPw" type="password" autocomplete="current-password" placeholder="비밀번호">
      </div>

      <button type="submit">로그인</button>
      <div id="msg" class="msg"></div>
    </form>

    <div class="demo">
      <strong>임시 본사 관리자 로그인</strong>
      아이디 : <b>hqadmin</b><br>
      비밀번호 : <b>1234</b>
    </div>

    <div class="note">
      현재는 화면 확인용 임시 로그인입니다.<br>
      실제 운영 전에는 서버 인증 방식으로 교체해야 합니다.
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var form=document.getElementById("loginForm");
var adminId=document.getElementById("adminId");
var adminPw=document.getElementById("adminPw");
var msg=document.getElementById("msg");

var TEMP_ID="hqadmin";
var TEMP_PW="1234";

form.addEventListener("submit",function(e){
  e.preventDefault();

  msg.className="msg";

  if(
    adminId.value.trim()===TEMP_ID &&
    adminPw.value===TEMP_PW
  ){
    try{
      sessionStorage.setItem("presaleHeadAdminLogin","1");
    }catch(err){}

    msg.textContent="로그인되었습니다.";
    msg.classList.add("ok");

    setTimeout(function(){
      location.href="/charge-management.html";
    },300);

    return;
  }

  msg.textContent="아이디 또는 비밀번호가 맞지 않습니다.";
  msg.classList.add("error");
});
})();
</script>

</body>
</html>
