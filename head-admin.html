<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102f42">
<title>본사 관리자 | 우리아파트 분양</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}

body{
  min-height:100vh;
  background:#eef7fb;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}

.wrap{
  width:100%;
  max-width:1280px;
  margin:0 auto;
  padding:14px;
}

.brand{
  margin-bottom:12px;
  padding:18px 20px;
  border-radius:14px;
  background:#102f42;
  color:#fff;
}

.brand small{
  display:block;
  margin-bottom:5px;
  color:#f0c15a;
  font-weight:800;
}

.brand h1{
  margin:0 0 5px;
  font-size:clamp(22px,4vw,28px);
}

.brand p{
  margin:0;
  color:#d8e5eb;
  font-size:13px;
}

.card{
  padding:18px;
  border:1px solid #dfe6eb;
  border-radius:14px;
  background:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.04);
}

#loginArea{
  max-width:520px;
  margin:40px auto 0;
}

.field{margin-bottom:12px}

label{
  display:block;
  margin-bottom:6px;
  color:#526676;
  font-size:13px;
  font-weight:800;
}

input{
  width:100%;
  height:46px;
  padding:0 12px;
  border:1px solid #cbd5dc;
  border-radius:8px;
  font-size:15px;
}

button{
  min-height:46px;
  border:0;
  border-radius:8px;
  background:#102f42;
  color:#fff;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

#loginArea button{
  width:100%;
}

.demo{
  margin-top:15px;
  padding:14px;
  border-radius:10px;
  background:#fff7df;
  color:#604d20;
  font-size:13px;
  line-height:1.7;
}

.msg{
  min-height:22px;
  margin-top:10px;
  font-size:13px;
  font-weight:700;
}

.msg.error{color:#c4473d}
.msg.ok{color:#17804b}

#adminArea{
  display:none;
}

.topbar{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  flex:1;
}

.tab{
  width:100%;
  background:#e8eef2;
  color:#314555;
}

.tab.active{
  background:#102f42;
  color:#fff;
}

.logout{
  flex:none;
  padding:0 16px;
  background:#dfe6eb;
  color:#314555;
}

.frame-wrap{
  overflow:hidden;
  border:1px solid #dfe6eb;
  border-radius:12px;
  background:#fff;
}

#contentFrame{
  display:block;
  width:100%;
  height:calc(100vh - 190px);
  min-height:650px;
  border:0;
  background:#fff;
}

@media(max-width:700px){
  .wrap{padding:8px}

  .topbar{
    align-items:stretch;
    flex-direction:column;
  }

  .tabs{
    grid-template-columns:1fr;
  }

  .logout{
    width:100%;
  }

  #contentFrame{
    height:calc(100vh - 300px);
    min-height:620px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <small>WOORI APT HEAD OFFICE</small>
    <h1>본사 관리자</h1>
    <p>충전금 관리 / 포인트 정산관리 / 시스템 설정</p>
  </div>

  <div id="loginArea" class="card">
    <h2>본사 관리자 로그인</h2>

    <form id="loginForm">

      <div class="field">
        <label for="adminId">아이디</label>
        <input
          id="adminId"
          type="text"
          autocomplete="username"
        >
      </div>

      <div class="field">
        <label for="adminPw">비밀번호</label>
        <input
          id="adminPw"
          type="password"
          autocomplete="current-password"
        >
      </div>

      <button type="submit">
        로그인
      </button>

      <div id="msg" class="msg"></div>
    </form>

    <div class="demo">
      <strong>임시 본사 관리자 로그인</strong><br>
      아이디 : <b>hqadmin</b><br>
      비밀번호 : <b>1234</b>
    </div>
  </div>


  <div id="adminArea">

    <div class="topbar">

      <div class="tabs">

        <button
          type="button"
          class="tab active"
          data-src="/charge-management.html">
          충전금 관리
        </button>

        <button
          type="button"
          class="tab"
          data-src="/point-settlement.html">
          포인트 정산관리
        </button>

        <button
          type="button"
          class="tab"
          data-src="/system-settings.html">
          시스템 설정
        </button>

      </div>

      <button
        type="button"
        id="logoutBtn"
        class="logout">
        로그아웃
      </button>

    </div>


    <div class="frame-wrap">

      <iframe
        id="contentFrame"
        src="/charge-management.html"
        title="본사 관리자 내용">
      </iframe>

    </div>

  </div>

</div>


<script>
(function(){
"use strict";

var loginArea=
  document.getElementById("loginArea");

var adminArea=
  document.getElementById("adminArea");

var form=
  document.getElementById("loginForm");

var adminId=
  document.getElementById("adminId");

var adminPw=
  document.getElementById("adminPw");

var msg=
  document.getElementById("msg");

var logoutBtn=
  document.getElementById("logoutBtn");

var frame=
  document.getElementById("contentFrame");

var tabs=
  Array.prototype.slice.call(
    document.querySelectorAll(".tab")
  );

var TEMP_ID="hqadmin";
var TEMP_PW="1234";


function showAdmin(){

  loginArea.style.display="none";
  adminArea.style.display="block";

}


function showLogin(){

  adminArea.style.display="none";
  loginArea.style.display="block";

}


function openTab(btn){

  tabs.forEach(function(x){
    x.classList.remove("active");
  });

  btn.classList.add("active");

  frame.src=
    btn.getAttribute("data-src");

}


tabs.forEach(function(btn){

  btn.addEventListener(
    "click",
    function(){
      openTab(btn);
    }
  );

});


try{

  if(
    sessionStorage.getItem(
      "presaleHeadAdminLogin"
    )==="1"
  ){
    showAdmin();
  }

}catch(e){}


form.addEventListener(
  "submit",
  function(e){

    e.preventDefault();

    msg.className="msg";

    if(
      adminId.value.trim()===TEMP_ID &&
      adminPw.value===TEMP_PW
    ){

      try{

        sessionStorage.setItem(
          "presaleHeadAdminLogin",
          "1"
        );

      }catch(e){}

      msg.textContent=
        "로그인되었습니다.";

      msg.classList.add("ok");

      frame.src=
        "/charge-management.html";

      tabs.forEach(function(x){
        x.classList.remove("active");
      });

      tabs[0].classList.add("active");

      showAdmin();

      return;
    }

    msg.textContent=
      "아이디 또는 비밀번호가 맞지 않습니다.";

    msg.classList.add("error");

  }
);


logoutBtn.addEventListener(
  "click",
  function(){

    try{

      sessionStorage.removeItem(
        "presaleHeadAdminLogin"
      );

    }catch(e){}

    adminId.value="";
    adminPw.value="";
    msg.textContent="";

    showLogin();

  }
);

})();
</script>

</body>
</html>
