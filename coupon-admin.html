<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전자쿠폰 발행관리</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f6f8;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}
.wrap{
  max-width:600px;
  margin:0 auto;
  padding:24px 16px 50px;
}
h1{
  margin:10px 0 6px;
  text-align:center;
  font-size:25px;
}
.sub{
  text-align:center;
  color:#667085;
  font-size:14px;
  margin-bottom:22px;
}
.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}
label{
  display:block;
  margin:15px 0 7px;
  font-weight:700;
  font-size:14px;
}
input{
  width:100%;
  height:48px;
  padding:0 13px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:16px;
}
button{
  width:100%;
  height:50px;
  margin-top:20px;
  border:0;
  border-radius:11px;
  background:#1165d7;
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}
button:disabled{
  opacity:.55;
}
.msg{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  line-height:1.6;
}
.ok{
  background:#ecfdf3;
  color:#067647;
}
.err{
  background:#fef3f2;
  color:#b42318;
}
</style>
</head>

<body>

<div class="wrap">

<h1>전자쿠폰 발행</h1>

<div class="sub">
분양 고객에게 제공할 전자쿠폰을 등록합니다.
</div>

<div class="card">

<label>쿠폰번호</label>
<input id="coupon_code" placeholder="예: CP20260001">

<label>쿠폰명</label>
<input id="coupon_name" placeholder="예: 입주고객 전자쿠폰">

<label>쿠폰금액</label>
<input id="coupon_amount" type="number" min="0" placeholder="예: 3000">

<label>발행수량</label>
<input id="issue_quantity" type="number" min="1" value="1">

<label>사용기한</label>
<input id="valid_until" type="date">

<button id="saveBtn">쿠폰 발행</button>

<div id="msg" class="msg"></div>

</div>
</div>

<script>

const saveBtn = document.getElementById("saveBtn");
const msg = document.getElementById("msg");

function message(text,type){
  msg.style.display="block";
  msg.className="msg "+type;
  msg.textContent=text;
}

saveBtn.addEventListener("click",async()=>{

  const coupon_code =
    document.getElementById("coupon_code").value.trim();

  const coupon_name =
    document.getElementById("coupon_name").value.trim();

  const coupon_amount =
    Number(document.getElementById("coupon_amount").value);

  const issue_quantity =
    Number(document.getElementById("issue_quantity").value);

  const valid_until =
    document.getElementById("valid_until").value;

  if(!coupon_code || !coupon_name || !coupon_amount ||
     !issue_quantity || !valid_until){

    message("모든 항목을 입력해주세요.","err");
    return;
  }

  saveBtn.disabled=true;
  saveBtn.textContent="발행 중...";

  try{

    const res=await fetch("/api/coupon-save",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        coupon_code,
        coupon_name,
        coupon_amount,
        issue_quantity,
        valid_until
      })
    });

    const data=await res.json();

    if(!res.ok || data.ok===false){
      throw new Error(
        data.message || "쿠폰 발행에 실패했습니다."
      );
    }

    message("전자쿠폰이 정상적으로 발행되었습니다.","ok");

  }catch(err){

    message(
      err.message || "쿠폰 발행 중 오류가 발생했습니다.",
      "err"
    );

  }finally{

    saveBtn.disabled=false;
    saveBtn.textContent="쿠폰 발행";

  }

});

</script>

</body>
</html>
