<style>
#chargeAdmin{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;
  background:#f5f7f9;
  color:#172b3d;
  padding:18px;
}

#chargeAdmin *{
  box-sizing:border-box;
}

#chargeAdmin .admin-head{
  margin-bottom:16px;
}

#chargeAdmin h2{
  margin:0 0 5px;
  font-size:24px;
}

#chargeAdmin .admin-head p{
  margin:0;
  font-size:13px;
  color:#71808d;
}

#chargeAdmin .summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px;
}

#chargeAdmin .summary-box{
  background:#fff;
  border:1px solid #dfe5ea;
  border-radius:10px;
  padding:15px;
}

#chargeAdmin .summary-box span{
  display:block;
  font-size:12px;
  color:#71808d;
  margin-bottom:7px;
}

#chargeAdmin .summary-box strong{
  font-size:21px;
}

#chargeAdmin .search-box{
  background:#fff;
  border:1px solid #dfe5ea;
  border-radius:10px;
  overflow:hidden;
}

#chargeAdmin .search-title{
  padding:14px 15px;
  font-size:16px;
  font-weight:800;
  border-bottom:1px solid #e4e9ed;
}

#chargeAdmin .filters{
  display:grid;
  grid-template-columns:1.3fr 1fr 1.5fr auto;
  gap:7px;
  padding:12px;
}

#chargeAdmin input,
#chargeAdmin select,
#chargeAdmin button{
  height:38px;
  border:1px solid #cad4dc;
  border-radius:6px;
  padding:0 9px;
  font-size:12px;
  background:#fff;
}

#chargeAdmin button{
  background:#12394d;
  color:#fff;
  border:0;
  font-weight:700;
  cursor:pointer;
  padding:0 14px;
}

#chargeAdmin .table-tools{
  padding:10px 12px;
  border-top:1px solid #e5eaee;
}

#chargeAdmin .table-wrap{
  overflow:auto;
}

#chargeAdmin table{
  width:100%;
  min-width:1000px;
  border-collapse:collapse;
}

#chargeAdmin th{
  background:#f6f8fa;
  color:#536575;
  font-size:12px;
  padding:11px 7px;
  border-bottom:1px solid #dfe5ea;
}

#chargeAdmin td{
  font-size:12px;
  padding:12px 7px;
  text-align:center;
  border-bottom:1px solid #edf0f2;
}

#chargeAdmin #empty{
  text-align:center;
  padding:55px 10px;
  color:#8b98a3;
}

@media(max-width:750px){
  #chargeAdmin{
    padding:10px;
  }

  #chargeAdmin .summary{
    grid-template-columns:1fr 1fr;
  }

  #chargeAdmin .filters{
    grid-template-columns:1fr 1fr;
  }

  #chargeAdmin h2{
    font-size:21px;
  }
}
</style>

<div id="chargeAdmin">

  <div class="admin-head">
    <h2>충전금 관리</h2>
    <p>전국 분양사의 충전금 충전·사용·잔액 현황을 통합 관리합니다.</p>
  </div>

  <div class="summary">
    <div class="summary-box">
      <span>총 충전금</span>
      <strong id="c1">0원</strong>
    </div>

    <div class="summary-box">
      <span>총 사용금액</span>
      <strong id="c2">0원</strong>
    </div>

    <div class="summary-box">
      <span>총 잔액</span>
      <strong id="c3">0원</strong>
    </div>

    <div class="summary-box">
      <span>등록 분양사</span>
      <strong id="c4">0곳</strong>
    </div>
  </div>

  <div class="search-box">

    <div class="search-title">분양사 충전금 조회</div>

    <div class="filters">

      <select id="rg">
        <option value="">전체 지역</option>
        <option>서울특별시</option>
        <option>부산광역시</option>
        <option>대구광역시</option>
        <option>인천광역시</option>
        <option>대전광역시</option>
        <option>울산광역시</option>
        <option>세종특별자치시</option>
        <option>경기도</option>
        <option>강원특별자치도</option>
        <option>충청북도</option>
        <option>충청남도</option>
        <option>전북특별자치도</option>
        <option>전남광주통합특별시</option>
        <option>경상북도</option>
        <option>경상남도</option>
        <option>제주특별자치도</option>
      </select>

      <select id="st">
        <option value="">전체 상태</option>
        <option>정상</option>
        <option>잔액부족</option>
        <option>사용중지</option>
      </select>

      <input
        type="text"
        id="kw"
        placeholder="분양사·아파트명 검색"
      >

      <button type="button" id="searchBtn">
        조회
      </button>

    </div>

    <div class="table-tools">
      <span>
        총 <strong id="cnt">0</strong>개 분양사
      </span>
    </div>

    <div class="table-wrap">

      <table>
        <thead>
          <tr>
            <th>지역</th>
            <th>분양사</th>
            <th>아파트</th>
            <th>총 충전금</th>
            <th>사용금액</th>
            <th>현재잔액</th>
            <th>상태</th>
            <th>최근 충전일</th>
            <th>관리</th>
          </tr>
        </thead>

        <tbody id="rows"></tbody>
      </table>

      <div id="empty">
        등록된 분양사 충전금 내역이 없습니다.
      </div>

    </div>

  </div>

</div>

<script>
(function(){

  var root=document.getElementById("chargeAdmin");
  if(!root)return;

  var D=[];

  function el(id){
    return root.querySelector("#"+id);
  }

  function n(v){
    return Number(v||0).toLocaleString("ko-KR");
  }

  function show(A){
    var charged=0;
    var used=0;
    var balance=0;

    el("rows").innerHTML="";
    el("cnt").textContent=A.length;
    el("empty").style.display=A.length ? "none" : "block";

    A.forEach(function(x){
      charged+=Number(x.charged||0);
      used+=Number(x.used||0);
      balance+=Number(x.balance||0);

      var tr=document.createElement("tr");

      tr.innerHTML=
        "<td>"+(x.region||"-")+"</td>"+
        "<td>"+(x.company||"-")+"</td>"+
        "<td>"+(x.apt||"-")+"</td>"+
        "<td>"+n(x.charged)+"원</td>"+
        "<td>"+n(x.used)+"원</td>"+
        "<td>"+n(x.balance)+"원</td>"+
        "<td>"+(x.status||"정상")+"</td>"+
        "<td>"+(x.lastCharge||"-")+"</td>"+
        "<td>"+
          "<button type='button' class='manageBtn' data-id='"+x.id+"'>"+
            "관리"+
          "</button>"+
        "</td>";

      el("rows").appendChild(tr);
    });

    el("c1").textContent=n(charged)+"원";
    el("c2").textContent=n(used)+"원";
    el("c3").textContent=n(balance)+"원";
    el("c4").textContent=A.length+"곳";
  }

  function search(){
    var r=el("rg").value;
    var s=el("st").value;
    var q=el("kw").value.trim().toLowerCase();

    var result=D.filter(function(x){

      if(r && x.region!==r){
        return false;
      }

      if(s && x.status!==s){
        return false;
      }

      var text=(
        (x.company||"")+" "+
        (x.apt||"")
      ).toLowerCase();

      if(q && !text.includes(q)){
        return false;
      }

      return true;
    });

    show(result);
  }

  el("searchBtn").addEventListener("click",search);

  el("kw").addEventListener("keydown",function(e){
    if(e.key==="Enter"){
      search();
    }
  });

  show(D);

})();
</script>
