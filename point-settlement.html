<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12394d">
<title>포인트 정산관리 | 우리아파트 분양</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f5f7f9;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",Arial,sans-serif;
  overflow-x:hidden;
}

#pointSettlementApp{
  width:100%;
  max-width:1200px;
  margin:0 auto;
  padding:clamp(10px,2.4vw,18px);
}

#pointSettlementApp .head{
  margin-bottom:16px;
}

#pointSettlementApp .head h2{
  margin:0 0 5px;
  font-size:clamp(21px,3vw,24px);
}

#pointSettlementApp .head p{
  margin:0;
  color:#71808d;
  font-size:13px;
  line-height:1.5;
  word-break:keep-all;
}

#pointSettlementApp .summary{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:14px;
}

#pointSettlementApp .summary-box{
  min-width:0;
  padding:15px;
  border:1px solid #dfe5ea;
  border-radius:10px;
  background:#fff;
}

#pointSettlementApp .summary-box span{
  display:block;
  margin-bottom:7px;
  color:#71808d;
  font-size:12px;
}

#pointSettlementApp .summary-box strong{
  display:block;
  font-size:clamp(18px,2.5vw,21px);
  overflow-wrap:anywhere;
}

#pointSettlementApp .panel{
  overflow:hidden;
  border:1px solid #dfe5ea;
  border-radius:10px;
  background:#fff;
}

#pointSettlementApp .panel-title{
  padding:14px 15px;
  border-bottom:1px solid #e4e9ed;
  font-size:16px;
  font-weight:800;
}

#pointSettlementApp .filters{
  display:grid;
  grid-template-columns:1fr 1fr 1.3fr 1.6fr auto;
  gap:8px;
  padding:12px;
}

#pointSettlementApp input,
#pointSettlementApp select,
#pointSettlementApp button{
  width:100%;
  min-width:0;
  height:40px;
  padding:0 9px;
  border:1px solid #cad4dc;
  border-radius:6px;
  background:#fff;
  font:inherit;
  font-size:12px;
}

#pointSettlementApp button{
  border:0;
  background:#12394d;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

#pointSettlementApp .table-tools{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  padding:10px 12px;
  border-top:1px solid #e5eaee;
  font-size:13px;
}

#pointSettlementApp .table-wrap{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

#pointSettlementApp table{
  width:100%;
  min-width:1120px;
  border-collapse:collapse;
}

#pointSettlementApp th{
  padding:11px 7px;
  border-bottom:1px solid #dfe5ea;
  background:#f6f8fa;
  color:#536575;
  font-size:12px;
  white-space:nowrap;
}

#pointSettlementApp td{
  padding:12px 7px;
  border-bottom:1px solid #edf0f2;
  font-size:12px;
  text-align:center;
  white-space:nowrap;
}

#pointSettlementApp .paid{
  color:#17804b;
  font-weight:800;
}

#pointSettlementApp .waiting{
  color:#b27a20;
  font-weight:800;
}

#pointSettlementApp .amount{
  color:#12394d;
  font-weight:800;
}

#pointSettlementApp #empty{
  padding:55px 10px;
  color:#8b98a3;
  text-align:center;
  font-size:13px;
}

@media(max-width:900px){
  #pointSettlementApp .summary{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  #pointSettlementApp .filters{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  #pointSettlementApp .filters #searchBtn{
    grid-column:1 / -1;
  }
}

@media(max-width:560px){
  #pointSettlementApp{
    padding:10px;
  }

  #pointSettlementApp .summary{
    gap:8px;
  }

  #pointSettlementApp .summary-box{
    padding:12px;
  }

  #pointSettlementApp .filters{
    grid-template-columns:1fr;
  }

  #pointSettlementApp .filters #searchBtn{
    grid-column:auto;
  }

  #pointSettlementApp input,
  #pointSettlementApp select,
  #pointSettlementApp button{
    height:44px;
    font-size:13px;
  }

  #pointSettlementApp .table-tools{
    align-items:flex-start;
    flex-direction:column;
  }
}

@media(max-width:360px){
  #pointSettlementApp .summary{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="pointSettlementApp">

  <div class="head">
    <h2>포인트 정산관리</h2>
    <p>분양 카탈로그 유효조회에 따른 포인트 지급 및 정산내역을 관리합니다.</p>
  </div>

  <div class="summary">

    <div class="summary-box">
      <span>전체 지급건수</span>
      <strong id="s1">0건</strong>
    </div>

    <div class="summary-box">
      <span>총 지급 포인트</span>
      <strong id="s2">0 P</strong>
    </div>

    <div class="summary-box">
      <span>정산완료</span>
      <strong id="s3">0건</strong>
    </div>

    <div class="summary-box">
      <span>정산대기</span>
      <strong id="s4">0건</strong>
    </div>

  </div>

  <div class="panel">

    <div class="panel-title">
      포인트 지급·정산내역
    </div>

    <div class="filters">

      <input type="date" id="sd">
      <input type="date" id="ed">

      <select id="status">
        <option value="">전체 상태</option>
        <option value="WAITING">정산대기</option>
        <option value="PAID">정산완료</option>
      </select>

      <input
        type="text"
        id="kw"
        placeholder="분양사·현장명·쿠폰번호 검색"
      >

      <button type="button" id="searchBtn">
        조회
      </button>

    </div>

    <div class="table-tools">
      <div>총 <strong id="cnt">0</strong>건</div>
      <div>조회 포인트 <strong id="sumPoint">0 P</strong></div>
    </div>

    <div class="table-wrap">

      <table>
        <thead>
          <tr>
            <th>지급일시</th>
            <th>분양현장코드</th>
            <th>분양사명</th>
            <th>현장명</th>
            <th>쿠폰번호</th>
            <th>유효조회</th>
            <th>지급 포인트</th>
            <th>정산상태</th>
            <th>정산일</th>
          </tr>
        </thead>

        <tbody id="rows"></tbody>
      </table>

      <div id="empty">
        포인트 지급·정산 내역이 없습니다.
      </div>

    </div>

  </div>

</div>

<script>
(function(){
"use strict";

var root=document.getElementById("pointSettlementApp");
if(!root)return;

var D=[];

function el(id){
  return root.querySelector("#"+id);
}

function n(v){
  return Number(v||0).toLocaleString("ko-KR");
}

function render(A){

  var rows=el("rows");
  rows.innerHTML="";

  var totalPoint=0;
  var paid=0;
  var waiting=0;

  D.forEach(function(x){
    totalPoint+=Number(x.point||0);

    if(x.status==="PAID"){
      paid++;
    }else{
      waiting++;
    }
  });

  el("s1").textContent=n(D.length)+"건";
  el("s2").textContent=n(totalPoint)+" P";
  el("s3").textContent=n(paid)+"건";
  el("s4").textContent=n(waiting)+"건";

  el("cnt").textContent=A.length;

  var viewPoint=0;

  A.forEach(function(x){

    viewPoint+=Number(x.point||0);

    var tr=document.createElement("tr");

    tr.innerHTML=
      "<td>"+(x.date||"-")+"</td>"+
      "<td>"+(x.siteCode||"-")+"</td>"+
      "<td>"+(x.company||"-")+"</td>"+
      "<td>"+(x.siteName||"-")+"</td>"+
      "<td>"+(x.couponNo||"-")+"</td>"+
      "<td>"+(x.valid?"유효":"미완료")+"</td>"+
      "<td class='amount'>"+n(x.point)+" P</td>"+
      "<td class='"+(x.status==="PAID"?"paid":"waiting")+"'>"+
        (x.status==="PAID"?"정산완료":"정산대기")+
      "</td>"+
      "<td>"+(x.settledDate||"-")+"</td>";

    rows.appendChild(tr);
  });

  el("sumPoint").textContent=n(viewPoint)+" P";
  el("empty").style.display=A.length?"none":"block";
}

function search(){

  var sd=el("sd").value;
  var ed=el("ed").value;
  var status=el("status").value;
  var kw=el("kw").value.trim().toLowerCase();

  var result=D.filter(function(x){

    var date=String(x.date||"").slice(0,10);

    if(sd && date<sd){
      return false;
    }

    if(ed && date>ed){
      return false;
    }

    if(status && x.status!==status){
      return false;
    }

    var text=(
      (x.company||"")+" "+
      (x.siteName||"")+" "+
      (x.couponNo||"")+" "+
      (x.siteCode||"")
    ).toLowerCase();

    if(kw && !text.includes(kw)){
      return false;
    }

    return true;
  });

  render(result);
}

el("searchBtn").onclick=search;

el("kw").addEventListener(
  "keydown",
  function(e){
    if(e.key==="Enter"){
      search();
    }
  }
);

var today=new Date();

el("ed").value=
  today.toISOString().slice(0,10);

today.setDate(1);

el("sd").value=
  today.toISOString().slice(0,10);

render(D);

})();
</script>

</body>
</html>
