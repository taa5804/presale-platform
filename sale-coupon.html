<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1165d7">
<title>분양쿠폰 | 우리아파트</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
}
body{
  background:#f5f7fa;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
  overflow-x:hidden;
}
.wrap{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:clamp(14px,4vw,24px) clamp(10px,3vw,14px) 50px;
}
.card{
  width:100%;
  background:#fff;
  border:1px solid #e5e9ef;
  border-radius:14px;
  padding:clamp(16px,4vw,20px);
  box-shadow:0 4px 14px rgba(0,0,0,.04);
}
h1{
  margin:0 0 10px;
  font-size:clamp(22px,5vw,26px);
}
.desc{
  margin:0 0 20px;
  color:#667789;
  font-size:clamp(14px,3.5vw,16px);
  line-height:1.6;
  word-break:keep-all;
}
.field{
  width:100%;
  min-width:0;
  height:48px;
  border:1px solid #ccd5df;
  border-radius:8px;
  padding:0 12px;
  font-size:16px;
  margin-bottom:10px;
}
.btn{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:8px;
  background:#1165d7;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
.result{
  width:100%;
  margin-top:18px;
  padding:16px;
  border-radius:10px;
  background:#f7f9fc;
  display:none;
  line-height:1.7;
  overflow-wrap:anywhere;
}
@media(max-width:480px){
  .wrap{
    padding-left:10px;
    padding-right:10px;
  }
  .card{
    border-radius:12px;
  }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <h1>분양쿠폰 조회</h1>
    <p class="desc">발급받은 쿠폰번호를 입력해 주세요.</p>

    <input
      id="couponNumber"
      class="field"
      type="text"
      placeholder="쿠폰번호 입력"
      autocomplete="off"
    >

    <button id="searchBtn" class="btn" type="button">쿠폰 조회</button>

    <div id="result" class="result"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const couponNumber = document.getElementById("couponNumber");
  const searchBtn = document.getElementById("searchBtn");
  const result = document.getElementById("result");

  function searchCoupon(){
    const value = couponNumber.value.trim();

    if(!value){
      alert("쿠폰번호를 입력해 주세요.");
      couponNumber.focus();
      return;
    }

    result.style.display = "block";
    result.innerHTML =
      "<strong>쿠폰번호</strong> : " + value + "<br>" +
      "<strong>상태</strong> : 조회 준비중<br>" +
      "<strong>유효기간</strong> : 확인 예정";
  }

  searchBtn.addEventListener("click", searchCoupon);

  couponNumber.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
      searchCoupon();
    }
  });
})();
</script>

</body>
</html>
