<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12394d">
<title>분양사 관리자 | 우리아파트 분양</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{
  min-height:100vh;
  background:#eef7fb;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}
.wrap{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:clamp(24px,7vw,60px) 14px 50px;
}
.brand{
  margin-bottom:14px;
  padding:22px;
  border-radius:16px;
  background:#123f55;
  color:#fff;
}
.brand small{
  display:block;
  margin-bottom:8px;
  color:#f0c15a;
  font-weight:800;
}
.brand h1{margin:0 0 7px;font-size:clamp(23px,5vw,29px)}
.brand p{margin:0;color:#d8e5eb;font-size:13px;line-height:1.55}
.card{
  padding:20px;
  border:1px solid #dfe6eb;
  border-radius:16px;
  background:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}
h2{margin:0 0 16px;font-size:20px}
.field{margin-bottom:12px}
label{
  display:block;
  margin-bottom:6px;
  color:#526676;
  font-size:13px;
  font-weight:800;
}
input{
  width:100%;
  height:46px;
  padding:0 12px;
  border:1px solid #cbd5dc;
  border-radius:8px;
  font-size:15px;
}
button{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:8px;
  background:#123f55;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}
.demo{
  margin-top:15px;
  padding:14px;
  border-radius:10px;
  background:#fff7df;
  color:#604d20;
  font-size:13px;
  line-height:1.7;
}
.demo strong{display:block;margin-bottom:4px;color:#8a6511}
.msg{min-height:22px;margin-top:10px;font-size:13px;font-weight:700}
.msg.error{color:#c4473d}
.msg.ok{color:#17804b}

#menuArea{display:none}
.menu{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}
.menu a{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:64px;
  padding:0 17px;
  border:1px solid #dfe6eb;
  border-radius:10px;
  background:#fff;
  color:#172b3d;
  font-size:16px;
  font-weight:800;
  text-decoration:none;
}
.menu a span{color:#71808d;font-size:20px}
.logout{
  margin-top:14px;
  background:#e9eef2;
  color:#314555;
}
@media(max-width:480px){
  .wrap{padding-left:10px;padding-right:10px}
  .card{padding:16px}
  input{height:48px;font-size:16px}
}
</style>
</head>
<body>

<div class="wrap">

  <div class="brand">
    <small>WOORI APT PRESALE</small>
    <h1>분양사 관리자</h1>
    <p>분양등록·수정, 충전금 사용내역, 조회현황을 관리합니다.</p>
  </div>

  <div id="loginArea" class="card">
    <h2>관리자 로그인</h2>

    <form id="loginForm">
      <div class="field">
        <label for="adminId">아이디</label>
        <input id="adminId" type="text" autocomplete="username">
      </div>

      <div class="field">
        <label for="adminPw">비밀번호</label>
        <input id="adminPw" type="password" autocomplete="current-password">
      </div>

      <button type="submit">로그인</button>
      <div id="msg" class="msg"></div>
    </form>

    <div class="demo">
      <strong>임시 관리자 로그인</strong>
      아이디 : <b>presaleadmin</b><br>
      비밀번호 : <b>1234</b>
    </div>
  </div>

  <div id="menuArea" class="card">
    <h2>분양사 관리자 메뉴</h2>

    <div class="menu">
      <a href="/sale-admin.html">
        분양등록·수정 <span>›</span>
      </a>

      <a href="/charge-history.html">
        충전금 사용내역 <span>›</span>
      </a>

      <a href="/inquiry-status.html">
        조회현황 <span>›</span>
      </a>
    </div>

    <button type="button" id="logoutBtn" class="logout">로그아웃</button>
  </div>

</div>

<script>
(function(){
"use strict";

var loginArea=document.getElementById("loginArea");
var menuArea=document.getElementById("menuArea");
var form=document.getElementById("loginForm");
var adminId=document.getElementById("adminId");
var adminPw=document.getElementById("adminPw");
var msg=document.getElementById("msg");
var logoutBtn=document.getElementById("logoutBtn");

var TEMP_ID="presaleadmin";
var TEMP_PW="1234";

function showMenu(){
  loginArea.style.display="none";
  menuArea.style.display="block";
}

function showLogin(){
  menuArea.style.display="none";
  loginArea.style.display="block";
}

try{
  if(sessionStorage.getItem("presaleAdminLogin")==="1"){
    showMenu();
  }
}catch(e){}

form.addEventListener("submit",function(e){
  e.preventDefault();
  msg.className="msg";

  if(adminId.value.trim()===TEMP_ID && adminPw.value===TEMP_PW){
    try{
      sessionStorage.setItem("presaleAdminLogin","1");
    }catch(e){}

    msg.textContent="로그인되었습니다.";
    msg.classList.add("ok");
    showMenu();
    return;
  }

  msg.textContent="아이디 또는 비밀번호가 맞지 않습니다.";
  msg.classList.add("error");
});

logoutBtn.addEventListener("click",function(){
  try{
    sessionStorage.removeItem("presaleAdminLogin");
  }catch(e){}

  adminId.value="";
  adminPw.value="";
  msg.textContent="";
  showLogin();
});

})();
</script>

</body>
</html>
