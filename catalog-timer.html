<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>분양 카탈로그 확인</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
  background:#f4f6f8;
  color:#172b3d;
}
.wrap{
  max-width:760px;
  margin:0 auto;
  padding:24px 16px 60px;
}
.notice{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  padding:16px;
  border-radius:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  margin-bottom:18px;
}
.notice strong{
  display:block;
  font-size:18px;
  margin-bottom:6px;
}
.timer{
  font-size:26px;
  font-weight:900;
  color:#1165d7;
}
.progress{
  margin-top:12px;
  height:8px;
  background:#e5e7eb;
  border-radius:99px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  width:0;
  background:#1165d7;
}
.page{
  background:#fff;
  border-radius:16px;
  padding:28px 22px;
  margin-bottom:18px;
  min-height:520px;
  box-shadow:0 4px 16px rgba(0,0,0,.05);
}
.page h2{
  margin-top:0;
}
.complete{
  display:none;
  background:#ecfdf3;
  color:#067647;
  padding:16px;
  border-radius:12px;
  font-weight:800;
  margin-top:20px;
}
.coupon-btn{
  display:none;
  width:100%;
  height:52px;
  margin-top:16px;
  border:0;
  border-radius:11px;
  background:#1165d7;
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="notice">
    <strong>분양 카탈로그 확인 중</strong>
    <div>
      남은 시간:
      <span id="timer" class="timer">60</span>초
    </div>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </div>

  <section class="page">
    <h2>1페이지</h2>
    <p>분양 카탈로그 내용을 입력합니다.</p>
  </section>

  <section class="page">
    <h2>2페이지</h2>
    <p>분양 카탈로그 내용을 입력합니다.</p>
  </section>

  <section class="page">
    <h2>3페이지</h2>
    <p>분양 카탈로그 내용을 입력합니다.</p>
  </section>

  <section class="page">
    <h2>4페이지</h2>
    <p>분양 카탈로그 내용을 입력합니다.</p>
  </section>

  <section class="page">
    <h2>5페이지</h2>
    <p>분양 카탈로그 내용을 입력합니다.</p>
  </section>

  <section class="page">
    <h2>6페이지</h2>
    <p>분양 카탈로그 내용을 입력합니다.</p>
  </section>

  <section class="page">
    <h2>7페이지</h2>
    <p>분양 카탈로그 내용을 입력합니다.</p>
  </section>

  <section class="page">
    <h2>8페이지</h2>
    <p>분양 카탈로그 내용을 입력합니다.</p>
  </section>

  <div id="complete" class="complete">
    60초 확인과 카탈로그 스크롤 조건이 모두 완료되었습니다.
  </div>

  <button id="couponBtn" class="coupon-btn" type="button">
    전자쿠폰 받기
  </button>

</div>

<script>
(function(){

  var totalSeconds = 60;
  var remaining = totalSeconds;
  var timeComplete = false;
  var scrollComplete = false;

  var timerEl = document.getElementById("timer");
  var progressBar = document.getElementById("progressBar");
  var completeBox = document.getElementById("complete");
  var couponBtn = document.getElementById("couponBtn");

  function checkComplete(){
    if(timeComplete && scrollComplete){
      completeBox.style.display = "block";
      couponBtn.style.display = "block";
    }
  }

  var timer = setInterval(function(){

    remaining--;

    if(remaining < 0){
      remaining = 0;
    }

    timerEl.textContent = remaining;

    var percent =
      ((totalSeconds - remaining) / totalSeconds) * 100;

    progressBar.style.width = percent + "%";

    if(remaining === 0){
      clearInterval(timer);
      timeComplete = true;
      checkComplete();
    }

  },1000);

  function checkScroll(){

    var doc = document.documentElement;

    var scrollTop =
      window.pageYOffset ||
      doc.scrollTop ||
      document.body.scrollTop ||
      0;

    var maxScroll =
      Math.max(
        document.body.scrollHeight,
        doc.scrollHeight
      ) - window.innerHeight;

    if(maxScroll <= 0){
      return;
    }

    var percent =
      (scrollTop / maxScroll) * 100;

    if(percent >= 90){
      scrollComplete = true;
      checkComplete();
    }
  }

  window.addEventListener(
    "scroll",
    checkScroll,
    { passive:true }
  );

  couponBtn.addEventListener(
    "click",
    function(){
      window.location.href =
        "/electronic-coupon.html";
    }
  );

  checkScroll();

})();
</script>

</body>
</html>
