<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼성화재 스마트 안심주차 QR 카드 (45x60mm) 8장</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #f1f5f9;
    color: #0f172a;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 상단 제어바 (인쇄 시 숨김) */
  .control-bar {
    width: 100%;
    max-width: 900px;
    background: #ffffff;
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .control-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .control-title {
    font-size: 20px;
    font-weight: 800;
    color: #0c4da2;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge-size {
    background: #e0edff;
    color: #0c4da2;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
  }

  .btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn-print {
    background: #0c4da2;
    color: #ffffff;
    border: none;
    padding: 11px 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 14px rgba(12, 77, 162, 0.35);
    transition: all 0.2s;
  }

  .btn-print:hover {
    background: #083877;
    transform: translateY(-1px);
  }

  .notice-box {
    background: #eff6ff;
    border-left: 4px solid #0c4da2;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 13.5px;
    color: #1e3a8a;
    line-height: 1.6;
  }

  /* A4 용지 컨테이너 */
  .a4-page {
    width: 210mm;
    min-height: 297mm;
    background: #ffffff;
    padding: 14mm 10mm;
    box-shadow: 0 6px 30px rgba(0, 0, 0, 0.12);
    box-sizing: border-box;
    margin-bottom: 20px;
    position: relative;
  }

  /* 8장 카드 그리드 (반접이형: 가로 90mm x 세로 60mm 4행 2열 = 총 8세트 A4 1장에 완벽 수납) */
  .grid-fold {
    display: grid;
    grid-template-columns: repeat(2, 90mm);
    grid-auto-rows: 60mm;
    gap: 6mm 10mm;
    justify-content: center;
  }

  /* 개별 반접이형 카드 세트 (가로 90mm x 세로 60mm) */
  .fold-set {
    width: 90mm;
    height: 60mm;
    display: flex;
    border: 1px dashed #94a3b8;
    box-sizing: border-box;
    page-break-inside: avoid;
    break-inside: avoid;
    position: relative;
    background: #ffffff;
  }

  /* 중앙 접는 선 */
  .fold-line {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 45mm;
    width: 0;
    border-left: 1px dashed #94a3b8;
    z-index: 10;
  }

  .fold-indicator {
    position: absolute;
    top: 1mm;
    left: 45mm;
    transform: translateX(-50%);
    background: #e2e8f0;
    color: #475569;
    font-size: 7px;
    padding: 1px 4px;
    border-radius: 2px;
    font-weight: 800;
    z-index: 11;
  }

  /* 단일 카드 규격 (가로 45mm x 세로 60mm) */
  .card-face {
    width: 45mm;
    height: 60mm;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3.2mm 3mm;
    overflow: hidden;
    position: relative;
  }

  /* 앞면 (삼성화재 블루 테마) */
  .card-face.front {
    background: linear-gradient(180deg, #ffffff 0%, #f4f8fe 100%);
  }

  .front-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    border-bottom: 1.5px solid #0c4da2;
    padding-bottom: 1.8mm;
  }

  .samsung-brand {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .samsung-logo-badge {
    background: #0c4da2;
    color: #ffffff;
    font-size: 7.5px;
    font-weight: 900;
    letter-spacing: 0.5px;
    padding: 1px 4px;
    border-radius: 2px;
  }

  .samsung-kor {
    color: #0c4da2;
    font-size: 13.5px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }

  .service-sub {
    font-size: 8px;
    font-weight: 700;
    color: #334155;
    letter-spacing: -0.3px;
    margin-top: 1px;
  }

  /* 중앙 QR 영역 */
  .front-qr-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1mm 0;
  }

  .qr-frame {
    background: #ffffff;
    padding: 1.8mm;
    border-radius: 4px;
    border: 1.2px solid #0c4da2;
    box-shadow: 0 1px 4px rgba(12, 77, 162, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .qr-code-img {
    width: 25mm !important;
    height: 25mm !important;
  }

  .qr-code-img canvas,
  .qr-code-img img {
    width: 25mm !important;
    height: 25mm !important;
    display: block;
  }

  .serial-badge {
    margin-top: 1.2mm;
    background: #0c4da2;
    color: #ffffff;
    font-size: 8px;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 3px;
    letter-spacing: 0.5px;
  }

  /* 앞면 하단 안내 */
  .front-footer {
    text-align: center;
    background: #e9f2ff;
    border-radius: 3px;
    padding: 1.6mm 1mm;
    border: 0.8px solid #c7ddff;
  }

  .footer-highlight {
    color: #0c4da2;
    font-size: 7.8px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.4px;
  }

  .footer-sub {
    color: #475569;
    font-size: 6.8px;
    font-weight: 600;
    margin-top: 1px;
    letter-spacing: -0.3px;
  }

  /* 뒷면 설명서 */
  .card-face.back {
    background: #ffffff;
  }

  .back-header {
    border-bottom: 1.2px solid #0c4da2;
    padding-bottom: 1.5mm;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .back-brand-text {
    font-size: 9px;
    font-weight: 900;
    color: #0c4da2;
  }

  .back-title-text {
    font-size: 8px;
    font-weight: 800;
    color: #475569;
  }

  .back-steps {
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    padding: 1.5mm 0;
  }

  .back-step-item {
    display: flex;
    align-items: flex-start;
    gap: 1.8mm;
  }

  .step-circle {
    width: 3.8mm;
    height: 3.8mm;
    min-width: 3.8mm;
    background: #0c4da2;
    color: #ffffff;
    border-radius: 50%;
    font-size: 7px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 0.3mm;
  }

  .step-desc {
    font-size: 7.2px;
    line-height: 1.35;
    color: #1e293b;
    letter-spacing: -0.3px;
  }

  .step-desc strong {
    font-weight: 800;
    color: #0c4da2;
    display: block;
    font-size: 7.6px;
  }

  .back-benefits {
    background: #f8fafc;
    border: 0.8px solid #e2e8f0;
    border-radius: 3px;
    padding: 1.4mm 1.6mm;
  }

  .benefit-title {
    font-size: 7px;
    font-weight: 800;
    color: #0c4da2;
    margin-bottom: 0.6mm;
  }

  .benefit-list {
    font-size: 6.6px;
    color: #334155;
    line-height: 1.3;
    letter-spacing: -0.3px;
  }

  .back-footer {
    border-top: 0.8px solid #e2e8f0;
    padding-top: 1mm;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 6.5px;
    color: #64748b;
    font-weight: 600;
  }

  /* 인쇄 시 전용 미디어 쿼리 */
  @media print {
    body {
      background: #ffffff !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .no-print {
      display: none !important;
    }

    .a4-page {
      box-shadow: none !important;
      padding: 12mm 10mm !important;
      margin: 0 !important;
      width: 210mm !important;
      height: 297mm !important;
      page-break-after: avoid !important;
    }
  }
</style>
</head>
<body>

<div class="control-bar no-print">
  <div class="control-header">
    <div class="control-title">
      <span>🛡️ 삼성화재 스마트 안심주차 QR 카드 (45 × 60mm) 8장</span>
      <span class="badge-size">규격: 45mm x 60mm</span>
    </div>
    <div class="btn-group">
      <button class="btn-print" onclick="window.print()">
        🖨️ 지금 바로 인쇄하기 (Ctrl + P)
      </button>
    </div>
  </div>

  <div class="notice-box">
    <strong>💡 가장 편리한 제작 안내 (반접이형 8세트):</strong><br>
    • 가로 90mm × 세로 60mm 외곽 점선을 따라 가위로 오려낸 뒤, <strong>중앙 점선(접는 선)을 반으로 딱 접으면</strong> 45×60mm 앞·뒷면 완제품 카드가 바로 완성됩니다.<br>
    • <strong>인쇄 팁:</strong> 브라우저 인쇄 창에서 <strong>[여백: 기본 또는 없음]</strong>, <strong>[배경 그래픽: 반드시 체크 ✅]</strong>, <strong>[배율: 100%]</strong>로 설정하시면 45x60mm 정규격으로 정확히 출력됩니다.
  </div>
</div>

<!-- A4 출력 용지 -->
<div class="a4-page">
  <div class="grid-fold" id="cards-container">
    <!-- 8세트 카드가 JS로 렌더링됩니다 -->
  </div>
</div>

const CARDS_DATA = [
  { id: 1, serial: "CAR-0001", url: "https://wooriaptcd.com/c/CAR-0001" },
  { id: 2, serial: "CAR-0002", url: "https://wooriaptcd.com/c/CAR-0002" },
  { id: 3, serial: "CAR-0003", url: "https://wooriaptcd.com/c/CAR-0003" },
  { id: 4, serial: "CAR-0004", url: "https://wooriaptcd.com/c/CAR-0004" },
  { id: 5, serial: "CAR-0005", url: "https://wooriaptcd.com/c/CAR-0005" },
  { id: 6, serial: "CAR-0006", url: "https://wooriaptcd.com/c/CAR-0006" },
  { id: 7, serial: "CAR-0007", url: "https://wooriaptcd.com/c/CAR-0007" },
  { id: 8, serial: "CAR-0008", url: "https://wooriaptcd.com/c/CAR-0008" }
];

function renderCards() {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  CARDS_DATA.forEach(card => {
    const cardEl = document.createElement('div');
    cardEl.className = 'fold-set';
    cardEl.innerHTML = `
      <div class="fold-indicator">접는선</div>
      <div class="fold-line"></div>

      <!-- 앞면 (45x60mm) -->
      <div class="card-face front">
        <div class="front-header">
          <div class="samsung-brand">
            <span class="samsung-logo-badge">SAMSUNG</span>
            <span class="samsung-kor">삼성화재</span>
          </div>
          <div class="service-sub">스마트 안심주차 서비스</div>
        </div>

        <div class="front-qr-area">
          <div class="qr-frame">
            <div id="qrcode-${card.id}" class="qr-code-img"></div>
          </div>
          <div class="serial-badge">${card.serial}</div>
        </div>

        <div class="front-footer">
          <div class="footer-highlight">010 번호 비노출 안심주차</div>
          <div class="footer-sub">차량이동 요청 시 카메라 스캔</div>
        </div>
      </div>

      <!-- 뒷면 설명서 (45x60mm) -->
      <div class="card-face back">
        <div class="back-header">
          <span class="back-brand-text">삼성화재</span>
          <span class="back-title-text">안심주차 이용안내</span>
        </div>

        <div class="back-steps">
          <div class="back-step-item">
            <div class="step-circle">1</div>
            <div class="step-desc">
              <strong>내 차 등록 (최초 1회 10초)</strong>
              스마트폰 카메라로 앞면 QR 스캔 후 [차량번호·010] 입력 시 즉시 연동
            </div>
          </div>

          <div class="back-step-item">
            <div class="step-circle">2</div>
            <div class="step-desc">
              <strong>차량 앞유리 부착</strong>
              운전석 하단 잘 보이는 곳에 부착 (010 번호 완벽 보호 시작)
            </div>
          </div>
        </div>

        <div class="back-benefits">
          <div class="benefit-title">🛡️ 삼성화재 고객 전용 혜택</div>
          <div class="benefit-list">
            • 스팸·스토킹·보이스피싱 번호 유출 차단<br>
            • 주차 접촉사고 시 과실비율 무료 자문<br>
            • 차 빼달라는 요청 1초 푸시 알림 수신
          </div>
        </div>

        <div class="back-footer">
          <span>등록관리: wooriaptcd.com</span>
          <span style="font-weight:800; color:#0c4da2;">${card.serial}</span>
        </div>
      </div>
    `;

    container.appendChild(cardEl);

    // QR코드 고화질 생성 (실제 링크: wooriaptcd.com/c/CAR-000X)
    new QRCode(document.getElementById(`qrcode-${card.id}`), {
      text: card.url,
      width: 100,
      height: 100,
      colorDark: "#0c4da2",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  });
}

window.onload = renderCards;
</script>
</body>
</html>
